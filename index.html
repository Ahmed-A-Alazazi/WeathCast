<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeathCast - Your Weather Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blur-medium: 20px;
            --border-glass-bright: 1px solid rgba(255, 255, 255, 0.35);
            --shadow-glass: 0 8px 32px rgba(31, 38, 135, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            --shadow-hover: 0 20px 40px rgba(41, 71, 124, 0.3), 0 0 80px rgba(118, 184, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: 'Jost', sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #76B8FF 0%, #4A8AD4 40%, #29477C 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .bg-aurora {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        .bg-aurora::before {
            content: ''; position: absolute; inset: 0;
            background: 
                radial-gradient(ellipse 90% 50% at 30% 10%, rgba(255, 255, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse 70% 40% at 75% 20%, rgba(173, 216, 255, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse 80% 60% at 20% 70%, rgba(65, 105, 180, 0.2) 0%, transparent 50%);
            animation: auroraPulse 15s ease-in-out infinite;
        }

        @keyframes auroraPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.9; } }

        .glass-etching {
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.03; pointer-events: none; z-index: 0;
        }

        .container {
            position: relative; z-index: 1; max-width: 1200px;
            margin: 0 auto; padding: 20px; padding-top: 110px; min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(var(--blur-medium));
            -webkit-backdrop-filter: blur(var(--blur-medium));
            border: var(--border-glass-bright);
            border-radius: 24px;
            box-shadow: var(--shadow-glass);
            position: relative; overflow: hidden;
        }

        .glass-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            pointer-events: none; z-index: 1;
        }

        /* Sticky Header */
        header {
            position: fixed; top: 20px; left: 20px; right: 20px;
            max-width: 1160px; margin: 0 auto; padding: 16px 28px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 1000; animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }

        .header-left { display: flex; align-items: center; gap: 40px; }
        .logo { height: 48px; filter: drop-shadow(0 4px 12px rgba(41, 71, 124, 0.3)); transition: transform 0.3s ease; }
        .logo:hover { transform: scale(1.05); }
        .nav-links { display: flex; align-items: center; gap: 6px; }

        .nav-link {
            color: rgba(255, 255, 255, 0.8); text-decoration: none;
            font-size: 15px; font-weight: 600; padding: 12px 20px;
            border-radius: 14px; transition: all 0.3s ease; position: relative;
        }

        .nav-link:hover { color: white; background: rgba(255, 255, 255, 0.12); }
        .nav-link.active { color: white; background: rgba(255, 255, 255, 0.18); }
        .nav-link.active::after {
            content: ''; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            width: 20px; height: 3px; background: white; border-radius: 2px;
        }

        .nav-link-badge { position: relative; }
        .badge {
            position: absolute; top: 6px; right: 6px; width: 8px; height: 8px;
            background: #ff4757; border-radius: 50%; border: 2px solid rgba(118, 184, 255, 0.6);
            animation: pulse-badge 2s infinite;
        }
        @keyframes pulse-badge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }

        .mobile-menu-btn {
            display: none; background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 12px;
            padding: 10px; cursor: pointer; color: white;
        }
        .mobile-menu-btn svg { width: 24px; height: 24px; }

        /* Search Section - Centered & Wider */
        .search-section {
            max-width: 750px; margin: 0 auto 40px; padding: 14px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .search-wrapper { display: flex; gap: 12px; }

        .search-input {
            flex: 1; background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px;
            padding: 18px 28px; font-size: 16px; font-family: 'Jost', sans-serif;
            color: var(--text-primary); transition: all 0.3s ease;
        }
        .search-input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .search-input:focus {
            outline: none; background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 0 30px rgba(118, 184, 255, 0.2);
        }

        .search-btn {
            background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px; padding: 18px 32px; font-size: 15px; font-weight: 600;
            font-family: 'Jost', sans-serif; color: white; cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;
        }
        .search-btn:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }
        .search-btn svg { width: 20px; height: 20px; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .weather-content { display: none; animation: fadeInUp 0.6s ease-out; }
        .weather-content.active { display: block; }

        .main-weather {
            padding: 45px; text-align: center; margin-bottom: 25px;
            animation: fadeInUp 0.8s ease-out 0.3s both;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .main-weather:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }

        .location { font-size: 34px; font-weight: 700; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(41, 71, 124, 0.3); }
        .date-time { font-size: 14px; color: var(--text-secondary); margin-bottom: 30px; }
        .current-weather { display: flex; justify-content: center; align-items: center; gap: 45px; flex-wrap: wrap; }
        .weather-icon { width: 140px; height: 140px; filter: drop-shadow(0 10px 30px rgba(41, 71, 124, 0.3)); animation: floatIcon 4s ease-in-out infinite; }
        @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .temperature-block { text-align: left; }
        .temperature { font-size: 88px; font-weight: 700; line-height: 1; text-shadow: 0 4px 20px rgba(41, 71, 124, 0.25); }
        .temperature span { font-size: 44px; vertical-align: top; }
        .weather-description { font-size: 22px; font-weight: 500; color: var(--text-secondary); text-transform: capitalize; margin-top: 8px; }

        .weather-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin-bottom: 25px; }
        .detail-card { padding: 28px 24px; text-align: center; transition: all 0.4s ease; animation: fadeInUp 0.8s ease-out both; }
        .detail-card:nth-child(1) { animation-delay: 0.4s; }
        .detail-card:nth-child(2) { animation-delay: 0.5s; }
        .detail-card:nth-child(3) { animation-delay: 0.6s; }
        .detail-card:nth-child(4) { animation-delay: 0.7s; }
        .detail-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); }
        .detail-icon { width: 44px; height: 44px; margin: 0 auto 14px; opacity: 0.85; }
        .detail-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1.5px; }
        .detail-value { font-size: 26px; font-weight: 700; }

        .forecast-section { padding: 30px; animation: fadeInUp 0.8s ease-out 0.8s both; }
        .forecast-title { font-size: 18px; font-weight: 700; margin-bottom: 22px; text-align: center; }
        .forecast-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 14px; }
        .forecast-card {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px; padding: 22px 16px; text-align: center; transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        .forecast-card::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 50%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        }
        .forecast-card:hover { background: rgba(255, 255, 255, 0.18); transform: translateY(-4px); }
        .forecast-day { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
        .forecast-icon { width: 48px; height: 48px; margin: 0 auto 12px; }
        .forecast-temp { font-size: 18px; font-weight: 700; }
        .forecast-temp-low { font-size: 14px; color: var(--text-secondary); margin-left: 4px; }

        .loading { display: none; text-align: center; padding: 70px 20px; }
        .loading.active { display: block; }
        .spinner { width: 55px; height: 55px; border: 3px solid rgba(255,255,255,0.15); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-message { display: none; text-align: center; padding: 50px; }
        .error-message.active { display: block; }
        .error-message svg { width: 65px; height: 65px; margin-bottom: 18px; opacity: 0.7; }
        .error-message p { font-size: 17px; color: var(--text-secondary); }

        .initial-state { text-align: center; padding: 70px 20px; animation: fadeInUp 0.8s ease-out 0.4s both; }
        .initial-state svg { width: 110px; height: 110px; margin-bottom: 22px; opacity: 0.5; }
        .initial-state p { font-size: 17px; color: var(--text-secondary); }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .mobile-menu-btn { display: flex; }
            header { top: 10px; left: 10px; right: 10px; padding: 14px 20px; }
            .container { padding-top: 90px; }
            .logo { height: 40px; }
            .temperature { font-size: 64px; }
            .temperature span { font-size: 32px; }
            .weather-icon { width: 100px; height: 100px; }
            .current-weather { gap: 25px; }
            .main-weather { padding: 30px 20px; }
            .location { font-size: 26px; }
            .weather-description { font-size: 18px; }
            .search-wrapper { flex-direction: column; }
            .search-section { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="bg-aurora"></div>
    <div class="glass-etching"></div>

    <header class="glass-card">
        <div class="header-left">
            <a href="index.html"><img src="logo.png" alt="WeathCast" class="logo"></a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link active">Home</a>
                <a href="features.html" class="nav-link">Features</a>
                <a href="maps.html" class="nav-link">Weather Maps</a>
                <a href="alerts.html" class="nav-link nav-link-badge">Alerts<span class="badge"></span></a>
            </nav>
        </div>
        <button class="mobile-menu-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
    </header>

    <div class="container">
        <section class="search-section glass-card">
            <div class="search-wrapper">
                <input type="text" class="search-input" id="cityInput" placeholder="Search for a city..." autocomplete="off">
                <button class="search-btn" id="searchBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    Search
                </button>
            </div>
        </section>

        <div class="initial-state glass-card" id="initialState">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
            <p>Enter a city name to get the weather forecast</p>
        </div>

        <div class="loading" id="loadingState"><div class="spinner"></div><p>Fetching weather data...</p></div>

        <div class="error-message glass-card" id="errorState">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
            <p id="errorText">City not found. Please try another search.</p>
        </div>

        <div class="weather-content" id="weatherContent">
            <div class="main-weather glass-card">
                <h1 class="location" id="location">--</h1>
                <p class="date-time" id="dateTime">--</p>
                <div class="current-weather">
                    <img src="" alt="Weather" class="weather-icon" id="weatherIcon">
                    <div class="temperature-block">
                        <div class="temperature"><span id="temp">--</span><span>°C</span></div>
                        <p class="weather-description" id="description">--</p>
                    </div>
                </div>
            </div>

            <div class="weather-details">
                <div class="detail-card glass-card">
                    <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/><circle cx="12" cy="12" r="4"/></svg>
                    <p class="detail-label">Feels Like</p>
                    <p class="detail-value" id="feelsLike">--°C</p>
                </div>
                <div class="detail-card glass-card">
                    <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
                    <p class="detail-label">Humidity</p>
                    <p class="detail-value" id="humidity">--%</p>
                </div>
                <div class="detail-card glass-card">
                    <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>
                    <p class="detail-label">Wind Speed</p>
                    <p class="detail-value" id="windSpeed">-- km/h</p>
                </div>
                <div class="detail-card glass-card">
                    <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    <p class="detail-label">Pressure</p>
                    <p class="detail-value" id="pressure">-- hPa</p>
                </div>
            </div>

            <div class="forecast-section glass-card">
                <h2 class="forecast-title">5-Day Forecast</h2>
                <div class="forecast-grid" id="forecastGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '4d8fb5b93d4af21d66a2948710284366';
        const BASE_URL = 'https://api.openweathermap.org/data/2.5';

        function showState(state) {
            ['initialState','loadingState','errorState','weatherContent'].forEach(id => {
                const el = document.getElementById(id);
                el.style.display = 'none';
                el.classList.remove('active');
            });
            const el = document.getElementById(state === 'initial' ? 'initialState' : state === 'loading' ? 'loadingState' : state === 'error' ? 'errorState' : 'weatherContent');
            el.style.display = 'block';
            if (state !== 'initial') el.classList.add('active');
        }

        function formatDate(ts, tz) {
            return new Date((ts + tz) * 1000).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) return;
            showState('loading');
            try {
                const [weather, forecast] = await Promise.all([
                    fetch(`${BASE_URL}/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`).then(r => r.ok ? r.json() : Promise.reject('City not found')),
                    fetch(`${BASE_URL}/forecast?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`).then(r => r.json())
                ]);
                document.getElementById('location').textContent = `${weather.name}, ${weather.sys.country}`;
                document.getElementById('dateTime').textContent = formatDate(weather.dt, weather.timezone);
                document.getElementById('weatherIcon').src = `https://openweathermap.org/img/wn/${weather.weather[0].icon}@4x.png`;
                document.getElementById('temp').textContent = Math.round(weather.main.temp);
                document.getElementById('description').textContent = weather.weather[0].description;
                document.getElementById('feelsLike').textContent = `${Math.round(weather.main.feels_like)}°C`;
                document.getElementById('humidity').textContent = `${weather.main.humidity}%`;
                document.getElementById('windSpeed').textContent = `${Math.round(weather.wind.speed * 3.6)} km/h`;
                document.getElementById('pressure').textContent = `${weather.main.pressure} hPa`;

                const dailyForecasts = {};
                forecast.list.forEach(item => {
                    const date = new Date(item.dt * 1000).toDateString();
                    const hour = new Date(item.dt * 1000).getHours();
                    if (!dailyForecasts[date] || Math.abs(hour - 12) < Math.abs(new Date(dailyForecasts[date].dt * 1000).getHours() - 12)) dailyForecasts[date] = item;
                });
                document.getElementById('forecastGrid').innerHTML = Object.values(dailyForecasts).slice(0, 5).map(f => `
                    <div class="forecast-card">
                        <p class="forecast-day">${new Date(f.dt * 1000).toLocaleDateString('en-US', { weekday: 'short' })}</p>
                        <img class="forecast-icon" src="https://openweathermap.org/img/wn/${f.weather[0].icon}@2x.png">
                        <p class="forecast-temp">${Math.round(f.main.temp_max)}°<span class="forecast-temp-low">${Math.round(f.main.temp_min)}°</span></p>
                    </div>`).join('');
                showState('weather');
            } catch (e) {
                document.getElementById('errorText').textContent = 'City not found. Please check the spelling.';
                showState('error');
            }
        }

        document.getElementById('searchBtn').addEventListener('click', searchWeather);
        document.getElementById('cityInput').addEventListener('keypress', e => { if (e.key === 'Enter') searchWeather(); });
        showState('initial');
    </script>
</body>
</html>
